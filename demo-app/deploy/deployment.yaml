apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: notes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-app
          image: registry.example.com/notes/demo-app:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: DEMOAPP_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: demo-app-jwt
                  key: signing-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
