id: data-handling
name: Data handling / PII
touches: Response models, serialization, logging, exports, or changes to which personal data is stored, returned or recorded.
precedents:
  - id: DATA-EXPLICIT-RESPONSES
    statement: Returning storage entities directly, or through a mapper that copies every field by default, is a finding when the entity has fields the caller must not see, such as password hashes or other users' contact data.
    reason: Entities gain fields over time, and an entity-based response silently starts exposing each new one.
  - id: DATA-BULK-EXPORT
    statement: Bulk exports of personal data need an admin-level check.
    reason: An export exposes many users' data in one response.
