id: dependencies
name: Third-party dependencies
touches: Package manifests, lock files, package-source configuration (nuget.config, .npmrc, pip.conf), and tools or images fetched during builds.
precedents:
  - id: DEP-NEW-SOURCES
    statement: Adding a package source, an http:// source, or mapping package names to a source other than the public registry and [internal feed URL] is a finding. This is about where packages are fetched from, not about depending on internal packages, which is fine.
    reason: With several sources and no namespace mapping, anyone who publishes a same-named package on the other source gets code into the build (dependency confusion).
