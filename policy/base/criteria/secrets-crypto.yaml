id: secrets-crypto
name: Secrets / crypto
touches: Keys, credentials, password hashing, security-relevant randomness.
precedents:
  - id: SEC-CODE-FALLBACKS
    statement: A secret literal used as a fallback in source code, for example when an environment variable is missing, is a hardcoded secret and a finding, even if labelled "for local development".
    reason: The fallback is used in production whenever the variable is missing.
  - id: SEC-PASSWORD-HASHING
    statement: New password hashes must use a slow, salted algorithm (PBKDF2 with 600,000 or more iterations, bcrypt, scrypt or Argon2). Switching new passwords to a faster or unsalted hash is a finding.
    reason: A leaked table of fast hashes is cracked offline at billions of guesses per second.
  - id: SEC-RANDOMNESS-HELPERS
    statement: A helper whose name suggests security (SecureId, TokenGenerator) but uses a non-cryptographic RNG is a finding when its output is used as a credential.
    reason: Reviewers trust the name and do not open the helper.
  - id: SEC-KEY-ROTATION
    statement: Accepting a current and a previous key at the same time during rotation, both from the secret store, is not a finding.
    reason: Rotation needs an overlap window, and both keys stay secret.
