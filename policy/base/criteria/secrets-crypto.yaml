id: secrets-crypto
name: Secrets / crypto
touches: Keys, credentials, password hashing, security-relevant randomness, TLS settings.
precedents:
  - id: SEC-NO-SECRET-LITERALS
    statement: Secrets come from the secret store through environment variables or mounted files. A secret literal in code, committed config, a Dockerfile or a manifest is a finding, including a fallback "for local development".
    reason: The repository is readable by every engineer and CI job, and a fallback is used in production whenever the variable is missing.
  - id: SEC-PASSWORD-HASHING
    statement: Password hashes use a slow, salted algorithm (PBKDF2 with 600,000 or more iterations, bcrypt, scrypt or Argon2). A faster or unsalted hash for new passwords is a finding.
    reason: A leaked table of fast hashes is cracked offline at billions of guesses per second.
  - id: SEC-RANDOMNESS
    statement: Tokens, reset codes and ids used as credentials must come from a cryptographic RNG. A non-cryptographic RNG, including one wrapped in a helper with a reassuring name, is a finding when its output acts as a credential.
    reason: Non-cryptographic RNGs are predictable from their seed.
  - id: SEC-TLS-VALIDATION
    statement: Disabling certificate validation outside tests is a finding.
    reason: It allows a man-in-the-middle to read credentials and data.
  - id: SEC-KEY-ROTATION
    statement: Accepting a current and a previous key at the same time during rotation, both from the secret store, is not a finding.
    reason: Rotation needs an overlap window, and both keys stay secret.
