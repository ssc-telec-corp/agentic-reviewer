# DRAFT, NOT LOADED: precedents here are used only when policy/base/global.yaml
# sets precedents_enabled: true. The id, name and touches fields are always
# loaded, because the reviewer labels findings with the criterion id.
id: infrastructure
name: Infrastructure as code
touches: Dockerfiles, Kubernetes manifests, Helm charts, Terraform, or anything that changes how a service is built, exposed or isolated.
precedents:
  - id: INFRA-NEW-PRIVILEGE
    statement: Granting a workload privileged mode, host namespaces, host path mounts or added capabilities is a finding.
    reason: Host access turns any code-execution bug in the app into node compromise.
  - id: INFRA-EXPOSURE
    statement: A new public load balancer or node port, removing a network policy, or a change that makes a network policy's selector stop matching the workload is a finding.
    reason: Traffic that bypasses the ingress skips TLS and the trusted proxy. A network policy that selects nothing fails open without any error.
  - id: INFRA-BUILD-DOWNLOADS
    statement: Piping a download into a shell, or downloading build inputs over http, is a finding.
    reason: The build's output ships to production (TB-BUILD), so whoever controls the download controls the artifact.
