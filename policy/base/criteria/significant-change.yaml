# DRAFT, NOT LOADED: precedents here are used only when policy/base/global.yaml
# sets precedents_enabled: true. The id, name and touches fields are always
# loaded, because the reviewer labels findings with the criterion id.
id: significant-change
name: Significant changes
touches: New external integrations (webhooks, partner APIs), new data stores or file access, new classes of endpoint, or refactors of how endpoints, auth or configuration are wired.
precedents:
  - id: SIG-INBOUND-INTEGRATIONS
    statement: A new endpoint called by an outside system (a webhook or callback) must verify the caller, with a signature or a shared secret, before acting on the payload. A PR note saying the partner's IP is allowlisted counts only if code enforces it.
    reason: An unverified webhook is an anonymous endpoint that changes state based on attacker-supplied data.
  - id: SIG-REFACTOR-EQUIVALENCE
    statement: For refactors of endpoint registration, policies, response mapping or config binding, compare the security-relevant behaviour before and after (which check protects each route, which fields each response contains, which config keys are read). Report any difference, even if the PR calls it a pure refactor.
    reason: Large mechanical diffs get light human review, so a one-token regression inside one is easy to merge.
