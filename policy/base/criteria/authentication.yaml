id: authentication
name: Authentication
touches: Login, token issuing or validation, session handling, password handling, or any way a request gets an identity.
precedents:
  - id: AUTHN-TOKEN-VALIDATION
    statement: Token validation must check the signature, algorithm, issuer, audience and expiry. Disabling any of these, replacing the signature validator, or making a check depend on a config value that may be absent is a finding.
    reason: If any one check is skipped, anyone can mint or replay a token for any user.
    example: Setting ValidateIssuer = false while adding a second identity provider is a finding.
  - id: AUTHN-ONE-PATH
    statement: Identity comes only from the service's authentication handler. Headers, query parameters or config flags that set a user or role directly are findings, even when labelled as debug features.
    reason: Debug paths ship to production with the committed config (G-COMMITTED-CONFIG-IS-PRODUCTION).
  - id: AUTHN-ACCOUNT-ENUMERATION
    statement: Login failures must not reveal, through a different status code or message, whether an account exists.
    reason: Distinct errors for unknown accounts tell an attacker which emails are registered.
  - id: AUTHN-SESSION-COOKIES
    statement: Changing a session cookie to SameSite=None while CORS allows credentials from origins other than a fixed list is a finding.
    reason: Together, the two changes let any website make authenticated requests and read the responses.
