# DRAFT, NOT LOADED: precedents here are used only when policy/base/global.yaml
# sets precedents_enabled: true. The id, name and touches fields are always
# loaded, because the reviewer labels findings with the criterion id.
id: frontend
name: UI / frontend changes
touches: Browser code, templates, HTML rendering, Content-Security-Policy and other browser-facing response headers.
precedents:
  - id: FE-HTML-SINKS
    statement: User-controlled text written to the DOM through innerHTML, outerHTML, insertAdjacentHTML or document.write is a finding, including when it passes through an escaping helper that does not escape quotes as well as <, > and &.
    reason: Content shared between users makes injected HTML run in another user's session. Unlike React's default text rendering, these browser APIs parse HTML.
