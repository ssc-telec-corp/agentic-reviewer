# Test run of Anthropic's claude-code-security-review, unchanged, on PRs to
# this repository. A trial before the reviewer-core decision (docs/adr/0001),
# not the org-required workflow.
name: security-review-test

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: security-review-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Experiment: route model calls through OpenRouter instead of the Anthropic
    # API. Claude Code and the Anthropic Python SDK both read ANTHROPIC_BASE_URL.
    # Upstream requires a non-empty ANTHROPIC_API_KEY, so the OpenRouter key is
    # sent as x-api-key, which OpenRouter's docs do not confirm. See docs/adr/0010.
    env:
      ANTHROPIC_BASE_URL: https://openrouter.ai/api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          claude-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          claude-model: anthropic/claude-sonnet-5.5
          comment-pr: true
          run-every-commit: true
          exclude-directories: docs,policy,eval
